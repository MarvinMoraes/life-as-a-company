[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-factory"
version = "0.1.0"
description = "Fábrica de SaaS agêntica multiagente com memória em Obsidian"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.28"]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
factory = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
